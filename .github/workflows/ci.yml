name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python tools
        run: python -m compileall -q skills/choose-proven-cloud-stack/scripts tools tests
      - name: Validate catalog
        run: python skills/choose-proven-cloud-stack/scripts/validate_catalog.py
      # Dependency-free, stricter equivalent of skill-creator's quick_validate.py.
      - name: Quick-validate installable Skill package
        run: python tools/validate_skill_package.py
      - name: Run offline tests and v1 release gates
        run: python -m unittest discover -s tests -v

  distribution:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify project-level install routes
        env:
          DISABLE_TELEMETRY: "1"
        shell: bash
        run: |
          set -euo pipefail
          source_path="$GITHUB_WORKSPACE/skills/choose-proven-cloud-stack"
          agents=(codex claude-code cursor cline roo windsurf gemini-cli github-copilot)
          targets=(
            .agents/skills/choose-proven-cloud-stack/SKILL.md
            .claude/skills/choose-proven-cloud-stack/SKILL.md
            .agents/skills/choose-proven-cloud-stack/SKILL.md
            .agents/skills/choose-proven-cloud-stack/SKILL.md
            .roo/skills/choose-proven-cloud-stack/SKILL.md
            .windsurf/skills/choose-proven-cloud-stack/SKILL.md
            .agents/skills/choose-proven-cloud-stack/SKILL.md
            .agents/skills/choose-proven-cloud-stack/SKILL.md
          )

          for index in "${!agents[@]}"; do
            install_root="$(mktemp -d)"
            (
              cd "$install_root"
              npx --yes skills@1.5.22 add "$source_path" \
                --skill choose-proven-cloud-stack \
                --agent "${agents[$index]}" \
                --copy \
                --yes
              cmp "$source_path/SKILL.md" "$install_root/${targets[$index]}"
            )
          done
