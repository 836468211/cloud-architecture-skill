name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python tools
        run: python -m compileall -q skills/choose-proven-cloud-stack/scripts tools tests
      - name: Validate catalog
        run: python skills/choose-proven-cloud-stack/scripts/validate_catalog.py
      # Dependency-free, stricter equivalent of skill-creator's quick_validate.py.
      - name: Quick-validate installable Skill package
        run: python tools/validate_skill_package.py
      - name: Run offline tests and v1 release gates
        run: python -m unittest discover -s tests -v
